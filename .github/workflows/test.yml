name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres for the integration tests. `tests/helpers/postgres.ts` honors
    # TEST_DATABASE_URL and skips its testcontainers fallback when the service
    # is reachable — much faster than spinning up a container per run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: privapaid
          POSTGRES_PASSWORD: privapaid
          POSTGRES_DB: privapaid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privapaid -d privapaid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://privapaid:privapaid@localhost:5432/privapaid_test?schema=public
      TEST_DATABASE_URL: postgresql://privapaid:privapaid@localhost:5432/privapaid_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Upgrade npm to v11+. The lockfile is generated by npm 11 locally,
      # and npm 10 (bundled with Node 22) is stricter about optional peer
      # deps with version conflicts — specifically `@prisma/config` → `c12`
      # declares `magicast@^0.3.5` as an optional peer while
      # `@vitest/coverage-istanbul` pulls `magicast@^0.5.2`. npm 11 dedupes
      # cleanly; npm 10 errors with "Missing: magicast@0.3.5 from lock file".
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Fail the build on known high/critical advisories so vulnerable
      # dependencies can't merge silently (Dependabot only alerts after the
      # fact). `high` rather than `moderate` keeps the gate low-noise.
      #
      # `--omit=dev` scopes the gate to what actually ships. The dev toolchain
      # (eslint, testcontainers) pulls a transitive brace-expansion DoS
      # advisory (GHSA-mh99-v99m-4gvg) with no fix available upstream, which
      # would otherwise block every PR on something that never runs in prod.
      # Dev advisories still surface via Dependabot.
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Enable citext extension
        run: |
          PGPASSWORD=privapaid psql -h localhost -U privapaid -d privapaid_test \
            -c "CREATE EXTENSION IF NOT EXISTS citext;"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          SK_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          AUTH_SECRET: "test-auth-secret-at-least-32-characters-long"
          NEXTAUTH_URL: "http://localhost:3000"
          SATSRAIL_WEBHOOK_SECRET: "test-webhook-secret"
          SATSRAIL_API_URL: "https://satsrail.com/api/v1"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
