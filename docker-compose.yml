services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped

  video-worker:
    profiles: ["video"]
    build:
      context: .
      dockerfile: Dockerfile.video-worker
    env_file: .env
    volumes:
      - app-data:/app/data
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    memswap_limit: 2g
    ulimits:
      core: 0
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          pids: 128
          memory: 2G
          cpus: "2.0"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-privapaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-privapaid}
      POSTGRES_DB: ${POSTGRES_DB:-privapaid}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-privapaid} -d ${POSTGRES_DB:-privapaid}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped

volumes:
  postgres-data:
  app-data:
